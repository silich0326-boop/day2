<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 길잡이 채팅</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: sans-serif;
      background: #dce3ee;
      color: #1f2a44;
      font-size: 17px;
    }
    .app {
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: #f6f8fc;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.12);
    }
    header {
      background: #1f2a44;
      color: #fff;
      padding: 14px 16px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header small { display: block; margin-top: 2px; font-size: 14px; color: #bfd0ea; }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .empty { margin: auto; text-align: center; color: #5b6680; font-size: 15px; line-height: 1.6; }
    .msg {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 18px;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .me { align-self: flex-end; background: #e8730c; color: #fff; border-bottom-right-radius: 6px; }
    .ai { align-self: flex-start; background: #fff; border: 1px solid #e2e7f0; border-bottom-left-radius: 6px; }

    .dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 2px;
      border-radius: 50%;
      background: #9aa6bf;
      animation: blink 1s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

    form { display: flex; gap: 8px; padding: 8px 12px 6px; }
    input {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      padding: 12px 14px;
      border: 1.5px solid #c5cedd;
      border-radius: 14px;
    }
    input:focus { outline: 2px solid #e8730c; border-color: transparent; }
    button {
      border: 0;
      background: #1f2a44;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 14px;
      padding: 0 18px;
      min-height: 48px;
      cursor: pointer;
    }
    .note { font-size: 13px; color: #5b6680; text-align: center; padding: 0 12px 10px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🍊 제주 길잡이</h1>
      <small>추운 날 어디 갈지 같이 골라요</small>
    </header>

    <div id="log" aria-live="polite">
      <div class="empty" id="empty">
        혼저 옵서예! 👋<br>
        궁금한 걸 물어보세요.<br>
        예) 오늘 날씨가 추운데 걷기 좋은 곳 있어?
      </div>
    </div>

    <form id="f">
      <input id="q" placeholder="궁금한 걸 물어보세요" autocomplete="off" aria-label="질문 입력">
      <button>보내기</button>
    </form>
    <div class="note">지금은 가짜 답이에요 · 5일차에 진짜로 찾아보고 판단해요</div>
  </div>

  <script>
    const REPLIES = [
      '혼저 옵서예! 🍊 추운 날 제주를 여행 중이시군요. 지금 어느 지역에 계신지, 그리고 밖에서 얼마나 걸을 수 있을지 알려 주세요.',
      '그렇다면 곶자왈 숲길을 추천해요. 나무가 바람을 어느 정도 막아 줘서 추운 날에도 걷기 편해요. 걷다가 몸이 식으면 근처 귤 창고 카페에서 따뜻한 차 한 잔 어때요? ☕',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
    ];
    let turn = 0;

    const log = document.getElementById('log');
    const q = document.getElementById('q');

    function add(cls, text) {
      const empty = document.getElementById('empty');
      if (empty) empty.remove();
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      if (text !== undefined) d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }

    function send(text) {
      text = text.trim();
      if (!text) { q.focus(); return; }
      add('me', text);
      q.value = '';

      const wait = add('ai');
      wait.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      log.scrollTop = log.scrollHeight;

      setTimeout(() => {
        wait.textContent = REPLIES[turn % REPLIES.length];
        turn++;
        log.scrollTop = log.scrollHeight;
      }, 1000);
    }

    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      send(q.value);
    });
  </script>
</body>
</html>
