<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 슬라이드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: #fff8ee;
      color: #1f2a44;
    }
    .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 24px; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      padding: 12px 14px;
      border: 1.5px solid #c5cedd;
      border-radius: 12px;
    }
    button {
      font-size: 16px;
      font-weight: bold;
      padding: 0 18px;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      background: #e8730c;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #c5cedd; cursor: default; }
    button.sub { background: #1f2a44; }
    #msg { min-height: 1.4em; margin: 0; color: #c0392b; }
    .stage {
      position: relative;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(31, 42, 68, 0.1);
      overflow: hidden;
    }
    .stage img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: contain;
      background: #f2f2f2;
    }
    .stage .cap { padding: 10px 14px; font-size: 14px; color: #5b6680; }
    .arrow {
      position: absolute;
      top: 190px;
      width: 44px;
      height: 44px;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      background: rgba(31, 42, 68, 0.7);
      font-size: 22px;
    }
    #prev { left: 10px; }
    #next { right: 10px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; }
    #count { font-weight: bold; }
    .thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .thumbs img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 3px solid transparent;
      cursor: pointer;
      flex: none;
    }
    .thumbs img.on { border-color: #e8730c; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🖼️ 이미지 슬라이드</h1>

    <form id="f">
      <input id="q" placeholder="검색어 (예: 제주 귤)" autocomplete="off" aria-label="검색어">
      <button>검색</button>
    </form>
    <p id="msg" role="alert"></p>

    <div id="viewer" hidden>
      <div class="stage">
        <img id="big" alt="">
        <button type="button" class="arrow" id="prev" aria-label="이전">‹</button>
        <button type="button" class="arrow" id="next" aria-label="다음">›</button>
        <div class="cap" id="cap"></div>
      </div>
      <div class="bar">
        <span id="count"></span>
        <span>
          <button type="button" class="sub" id="pagePrev">◀ 이전 10개</button>
          <button type="button" class="sub" id="pageNext">다음 10개 ▶</button>
        </span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </div>

  <script>
    const PER_PAGE = 10;
    let hits = [], idx = 0, page = 1, total = 0, term = '';

    const $ = id => document.getElementById(id);
    const qEl = $('q'), msg = $('msg');

    async function load(p) {
      if (!term) { msg.textContent = '검색어를 입력해 주세요.'; qEl.focus(); return; }
      msg.textContent = '불러오는 중…';
      try {
        const res = await fetch('/api/pixabay?q=' + encodeURIComponent(term) + '&page=' + p);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '오류가 났어요 (' + res.status + ')');
        if (!data.hits.length) { msg.textContent = '검색 결과가 없어요.'; $('viewer').hidden = true; return; }
        hits = data.hits; total = data.totalHits; page = p; idx = 0;
        msg.textContent = '';
        $('viewer').hidden = false;
        render();
      } catch (err) {
        msg.textContent = err.message;
      }
    }

    function render() {
      const h = hits[idx];
      $('big').src = h.webformatURL;
      $('big').alt = h.tags;
      $('cap').textContent = '태그: ' + h.tags + ' · 작가: ' + h.user;
      $('count').textContent = (idx + 1) + ' / ' + hits.length + ' (페이지 ' + page + ')';
      $('pagePrev').disabled = page <= 1;
      $('pageNext').disabled = page * PER_PAGE >= total;
      const box = $('thumbs');
      box.textContent = '';
      hits.forEach((x, i) => {
        const t = document.createElement('img');
        t.src = x.previewURL;
        t.alt = x.tags;
        if (i === idx) t.className = 'on';
        t.onclick = () => { idx = i; render(); };
        box.appendChild(t);
      });
    }

    function move(d) { idx = (idx + d + hits.length) % hits.length; render(); }

    $('f').addEventListener('submit', e => { e.preventDefault(); term = qEl.value.trim(); load(1); });
    $('prev').onclick = () => move(-1);
    $('next').onclick = () => move(1);
    $('pagePrev').onclick = () => load(page - 1);
    $('pageNext').onclick = () => load(page + 1);
    document.addEventListener('keydown', e => {
      if ($('viewer').hidden || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') move(-1);
      if (e.key === 'ArrowRight') move(1);
    });
  </script>
</body>
</html>
