<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      gap: 24px;
    }
    #count {
      font-size: 96px;
      font-weight: bold;
    }
    button {
      font-size: 24px;
      padding: 12px 32px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="count">0</div>
  <button id="btn">-1</button>

  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      count -= 1;
      countEl.textContent = count;
    });
  </script>
</body>
</html>
