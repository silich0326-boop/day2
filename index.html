<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부품 지도</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
      background: #f6f8fc;
      color: #1f2a44;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    h1 { font-size: 22px; margin: 0; }
    .sub { color: #5b6680; margin: 0; font-size: 15px; }
    .wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 28px; }
    .part {
      position: relative;
      border: 2px dashed #e8730c;
      border-radius: 10px;
      padding: 22px 16px 12px;
    }
    .tag {
      position: absolute;
      top: -13px;
      left: 12px;
      background: #e8730c;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 99px;
    }
    .head { background: #1f2a44; color: #fff; border-radius: 6px; padding: 14px 16px; }
    .head b { font-size: 20px; }
    .head p { margin: 4px 0 0; font-size: 14px; color: #bfd0ea; }
    .tabs { display: flex; gap: 8px; }
    .tabs span { background: #eef4fb; padding: 6px 14px; border-radius: 99px; font-weight: bold; }
    .card { background: #fff; border-radius: 18px; box-shadow: 0 4px 18px rgba(31, 42, 68, 0.1); padding: 18px; }
    .card h2 { margin: 0 0 8px; font-size: 18px; color: #e8730c; }
    .list { line-height: 1.8; }
    .foot { text-align: center; color: #5b6680; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; font-size: 16px; }
    td { border-top: 1px solid #e2e7f0; padding: 8px 12px; }
    .no { color: #9aa6bf; }
  </style>
</head>
<body>
  <h1>🗺️ 부품 지도</h1>
  <p class="sub">index.html에 있는 화면 부품에 이름표를 붙였어요</p>

  <div class="wrap">
    <div class="part">
      <span class="tag">헤더</span>
      <div class="head"><b>내 취향 카드</b><p>내가 좋아하는 것을 모아 놓은 카드예요</p></div>
    </div>

    <div class="part">
      <span class="tag">탭 (내비게이션 메뉴)</span>
      <div class="tabs"><span>홈</span><span>내 취향</span><span>소개</span></div>
    </div>

    <div class="part">
      <span class="tag">카드</span>
      <div class="card">
        <h2>🌺 제주대학교에 오신 것을 환영합니다</h2>
        <div class="part">
          <span class="tag">목록</span>
          <div class="list">
            <div>🏔️ 한라산을 가까이에서 만나는 캠퍼스 생활</div>
            <div>🌅 바다와 오름이 가까운 학교 주변</div>
            <div>🍊 겨울이면 귤밭 풍경이 반겨 주는 섬</div>
          </div>
        </div>
      </div>
    </div>

    <div class="part">
      <span class="tag">푸터</span>
      <div class="foot">© 2026 day2 실습</div>
    </div>

    <table>
      <tr><td>버튼</td><td class="no">지금 index.html에는 없음</td></tr>
      <tr><td>입력창</td><td class="no">지금 index.html에는 없음</td></tr>
    </table>
  </div>
</body>
</html>
